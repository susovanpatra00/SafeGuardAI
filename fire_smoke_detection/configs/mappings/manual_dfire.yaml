# =============================================================
# Mapping config for MANUAL data (the Kaggle D-Fire dataset, or your
# own hand-labeled images in YOLO format).
# -------------------------------------------------------------
# The D-Fire / notebook dataset uses ids 0=smoke, 1=fire and does NOT
# always ship a data.yaml. So we declare the source class order here
# via `source_names`; ingest_external.py uses it to turn label ids
# back into names before remapping to canonical names.
#
# If YOUR manual dataset already has a data.yaml, you can delete
# `source_names` and it'll be read from disk instead.
# =============================================================

source_dataset: manual-dfire

# Class order of the RAW manual labels (id 0 -> smoke, id 1 -> fire).
source_names:
  - smoke
  - fire

mapping:
  smoke: smoke
  fire: fire

# Known-corrupt / mislabeled images to quarantine, relative to the
# source root. (These are the ones flagged in the original notebook.)
bad_images:
