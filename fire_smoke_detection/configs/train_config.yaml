# =============================================================
# train_config.yaml
# -------------------------------------------------------------
# Hyperparameters for Smoke & Fire detection training.
# Edit these instead of touching src/training/train.py.
# =============================================================

# Which pretrained YOLO checkpoint to start from.
# Using YOLO11 (matches the Roboflow YOLOv11 dataset export).
# Options: yolo11n.pt (nano), yolo11s.pt (small), yolo11m.pt (medium),
#          yolo11l.pt (large), yolo11x.pt (extra large)
# Other families also work: yolo12n.pt, yolov8n.pt, etc.
model_variant: yolo11n.pt

epochs: 60
imgsz: 640
batch: 16

# Stop early if validation metrics don't improve for this many epochs.
patience: 20

# null = let Ultralytics auto-select GPU/CPU/MPS.
# Set explicitly if needed, e.g. "mps" for Apple Silicon, "cpu", or "0" for GPU 0.
device: null

verbose: true

# Where trained runs get saved: models/trained/<run_name>/weights/best.pt
project_dir: models/trained
