# =============================================================
# active_classes.yaml
# -------------------------------------------------------------
# Single source of truth for which PPE classes are currently
# part of the model + compliance logic.
#
# HOW TO ADD A CLASS:
#   1. Create data/raw/<class_name>/images/ and labels/
#   2. Add an entry below with active: true
#   3. Run scripts/rebuild_dataset.sh
#   4. Retrain
#
# HOW TO REMOVE A CLASS:
#   1. Set active: false below (keep the raw data folder, don't delete it)
#   2. Run scripts/rebuild_dataset.sh
#   3. Retrain
#
# NOTES:
#   - "person" must always stay active. It's the anchor box used
#     to associate every PPE item with an individual worker.
#   - required_for_compliance: true means this class must be present
#     (as its "positive" detection) for a person to be marked compliant.
#   - Class names here MUST exactly match the folder names under data/raw/
# =============================================================
classes:
  person:
    active: true
    required_for_compliance: false

  helmet:
    active: true
    required_for_compliance: true

  vest:
    active: true
    required_for_compliance: true

  boots:
    active: true
    required_for_compliance: true

  gloves:
    active: true
    required_for_compliance: false

  goggles:
    active: true
    required_for_compliance: false

  none:
    active: true
    required_for_compliance: false

  no_helmet:
    active: true
    required_for_compliance: false

  no_goggle:
    active: true
    required_for_compliance: false

  no_gloves:
    active: true
    required_for_compliance: false

  no_boots:
    active: true
    required_for_compliance: false

  
# -------------------------------------------------------------
# Matching settings used by person_matcher.py during compliance
# checking. Kept here so behavior tuning doesn't require code edits.
# -------------------------------------------------------------
matching:
  method: "iou"
  iou_threshold: 0.10
  center_contains_fallback: true