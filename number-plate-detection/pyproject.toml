[project]
name = "number-plate-detection"
version = "0.1.0"
description = "SafeGuardAI module — ANPR: license plate detection (YOLO) + OCR (PaddleOCR) on live RTSP feeds"
readme = "README.md"
requires-python = ">=3.10,<3.12"

dependencies = [
    # ── detection ──────────────────────────────────────────
    "ultralytics>=8.3.0",
    "torch",
    "torchvision",

    # ── video ingestion ────────────────────────────────────
    "opencv-python>=4.9.0",

    # ── ocr ─────────────────────────────────────────────────
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.7.0",

    # ── glue / utils ────────────────────────────────────────
    "pyyaml>=6.0",
    "numpy<2.0",
    "python-dotenv>=1.0.0",
    "roboflow>=1.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
